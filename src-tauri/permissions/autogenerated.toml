[[permission]]
identifier = "allow-get-connections"
description = "Allows retrieving the list of connections"
commands.allow = ["get_connections"]

[[permission]]
identifier = "allow-add-connection"
description = "Allows adding a new connection"
commands.allow = ["add_connection"]

[[permission]]
identifier = "allow-remove-connection"
description = "Allows removing a connection"
commands.allow = ["remove_connection"]

[[permission]]
identifier = "allow-test-connection"
description = "Allows testing a connection"
commands.allow = ["test_connection"]

[[permission]]
identifier = "allow-connect"
description = "Allows establishing an active connection"
commands.allow = ["connect"]

[[permission]]
identifier = "allow-export-connections"
description = "Allows exporting connections to a JSON file"
commands.allow = ["export_connections"]

[[permission]]
identifier = "allow-import-connections"
description = "Allows importing connections from a JSON file"
commands.allow = ["import_connections"]

[[permission]]
identifier = "allow-get-databases"
description = "Allows listing databases"
commands.allow = ["get_databases"]

[[permission]]
identifier = "allow-get-database-creation-options"
description = "Allows listing character sets and collations for database creation"
commands.allow = ["get_database_creation_options"]

[[permission]]
identifier = "allow-get-tables"
description = "Allows listing tables"
commands.allow = ["get_tables"]

[[permission]]
identifier = "allow-get-table-data"
description = "Allows retrieving data from a table"
commands.allow = ["get_table_data"]

[[permission]]
identifier = "allow-get-table-structure"
description = "Allows retrieving the structure of a table"
commands.allow = ["get_table_structure"]

[[permission]]
identifier = "allow-export-table"
description = "Allows exporting table data to a file"
commands.allow = ["export_table"]

[[permission]]
identifier = "allow-export-database"
description = "Allows exporting a full database to a SQL file"
commands.allow = ["export_database"]

[[permission]]
identifier = "allow-create-database"
description = "Allows creating a new database"
commands.allow = ["create_database"]

[[permission]]
identifier = "allow-drop-database"
description = "Allows permanently dropping a database"
commands.allow = ["drop_database"]

[[permission]]
identifier = "allow-import-sql"
description = "Allows importing a SQL file into a database"
commands.allow = ["import_sql"]

[[permission]]
identifier = "allow-cancel-import"
description = "Allows cancelling an ongoing SQL import"
commands.allow = ["cancel_import"]

[[permission]]
identifier = "allow-cancel-export"
description = "Allows cancelling an ongoing export"
commands.allow = ["cancel_export"]

[[permission]]
identifier = "allow-apply-table-changes"
description = "Allows applying changes (updates/deletes) to a table"
commands.allow = ["apply_table_changes"]

[[permission]]
identifier = "allow-drop-table"
description = "Allows permanently dropping a table"
commands.allow = ["drop_table"]

[[permission]]
identifier = "allow-drop-tables"
description = "Allows dropping multiple tables in a single operation"
commands.allow = ["drop_tables"]

[[permission]]
identifier = "allow-truncate-table"
description = "Allows truncating a table"
commands.allow = ["truncate_table"]

[[permission]]
identifier = "allow-get-foreign-keys"
description = "Allows retrieving the foreign keys of a table"
commands.allow = ["get_foreign_keys"]

[[permission]]
identifier = "allow-get-table-indexes"
description = "Allows retrieving the indexes of a table"
commands.allow = ["get_table_indexes"]

[[permission]]
identifier = "allow-execute-query"
description = "Allows executing an arbitrary SQL query"
commands.allow = ["execute_query"]

[[permission]]
identifier = "allow-cancel-query"
description = "Allows cancelling an ongoing SQL query"
commands.allow = ["cancel_query"]

[[permission]]
identifier = "allow-insert-row"
description = "Allows inserting a new row into a table"
commands.allow = ["insert_row"]

[[permission]]
identifier = "allow-get-table-ddl"
description = "Allows retrieving the DDL (CREATE TABLE) of a table"
commands.allow = ["get_table_ddl"]

[[permission]]
identifier = "allow-get-saved-queries"
description = "Allows retrieving the list of saved queries"
commands.allow = ["get_saved_queries"]

[[permission]]
identifier = "allow-upsert-saved-query"
description = "Allows creating or updating a saved query"
commands.allow = ["upsert_saved_query"]

[[permission]]
identifier = "allow-delete-saved-query"
