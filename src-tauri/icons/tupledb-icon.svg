<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="TupleDB app icon">
  <defs>
    <linearGradient id="bg" x1="160" y1="120" x2="864" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23262b"/>
      <stop offset="1" stop-color="#131519"/>
    </linearGradient>
    <linearGradient id="mint" x1="390" y1="250" x2="860" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33d894"/>
      <stop offset="1" stop-color="#109f6a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="36" y="36" width="952" height="952" rx="194" fill="none" stroke="#2d333a" stroke-width="20"/>

  <g filter="url(#shadow)">
    <text
      x="96"
      y="682"
      font-family="'Inter Tight', 'Noto Sans', 'Segoe UI', sans-serif"
      font-size="480"
      font-weight="700"
      letter-spacing="-38"
      fill="#f2f4f7"
      text-anchor="start"
      transform="translate(42 0)"
    >t<tspan fill="url(#mint)">db</tspan></text>
  </g>
</svg>
